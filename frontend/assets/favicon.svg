<!-- Simple SVG favicon for VisuaLens -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Eye/lens icon -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="16" cy="16" r="4" fill="white"/>
  <circle cx="16" cy="16" r="2" fill="#1e40af"/>
  
  <!-- Question mark indicator -->
  <text x="26" y="10" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">?</text>
</svg>
